name: repository-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Obsidian URI contains the vault folder name.
          path: 模擬裁判_検察官準備_20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: 模擬裁判_検察官準備_20261020
      - run: python 作成用/verify_repository.py
        working-directory: 模擬裁判_検察官準備_20261020
        env:
          PYTHONUTF8: '1'
