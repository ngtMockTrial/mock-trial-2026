<rect x="450" y="115" width="700" height="115" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="464" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">Q　要証事実又は検討対象</text>
<text x="464" y="161.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">最終的な検討対象</text>
<text x="464" y="184.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">木村の犯人性に合理的な疑いが残るか</text>
<text x="464" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">立証責任は検察官。詳細は既存資料01</text>
<rect x="45" y="385" width="430" height="150" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="59" y="408" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R1　反対事情又は限界</text>
<text x="59" y="433.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">昼に眼鏡を落とし</text>
<text x="59" y="460.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">別人の犯行時に血が付いたとの説明</text>
<text x="59" y="523" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">弁護冒頭陳述 p.34</text>
<rect x="585" y="385" width="430" height="150" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="599" y="408" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R2　反対事情又は限界</text>
<text x="599" y="433.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">大滝が清掃で</text>
<text x="599" y="460.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">眼鏡を見落とした可能性</text>
<text x="599" y="523" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">準備：甲3 p.21-22</text>
<rect x="1125" y="385" width="430" height="150" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="1139" y="408" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R3　反対事情又は限界</text>
<text x="1139" y="433.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">共用自転車を別人が使用</text>
<text x="1139" y="460.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">映像も木村と特定できない</text>
<text x="1139" y="523" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">甲1 p.4-5、弁護主張 p.34</text>
<rect x="45" y="800" width="430" height="150" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="59" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">C1　主張又は要確認</text>
<text x="59" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">落下の記憶と推測を分ける</text>
<text x="59" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">具体的な場所を実演で確認</text>
<text x="59" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">準備：乙2 p.28-29</text>
<rect x="585" y="800" width="430" height="150" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="599" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">C2　主張又は要確認</text>
<text x="599" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">B地点の経路・向き・見え方</text>
<text x="599" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">急ぎによる作業の変化を確認</text>
<text x="599" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">準備：甲3 p.21-22</text>
<rect x="1125" y="800" width="430" height="150" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="1139" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">C3　認定する事実</text>
<text x="1139" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">他人の指紋・無施錠・開放駐輪場</text>
<text x="1139" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">映像の顔が判別不能</text>
<text x="1139" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4-5</text>
<rect x="158.0" y="635.5" width="204.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="164.0" y="654.5" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　説明の確かさを検討</text>
<rect x="690.0" y="635.5" width="220.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="696.0" y="654.5" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　見落としの程度を検討</text>
<rect x="1222.0" y="635.5" width="236.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1228.0" y="654.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　別人説に関わる客観事情</text>
<rect x="281.5" y="275.5" width="252.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="287.5" y="294.5" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　現場との接点の評価に影響</text>
<rect x="682.0" y="275.5" width="236.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="688.0" y="294.5" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　清掃後の落下推認に影響</text>
<rect x="1074.5" y="275.5" width="236.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1080.5" y="294.5" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　使用者・本人特定に影響</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">弁護側の説明は教材p.34-35と乙2 p.27-31を参照。乙2の細部は実演で確認する。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">被告人に無実や別人の犯行の証明を求めない。証拠全体から残る合理的な疑いを検討する。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">清掃証言が具体的に裏付けられなければ、眼鏡の落下時刻の推認を弱め、結びも再検討する。</text>
</svg>