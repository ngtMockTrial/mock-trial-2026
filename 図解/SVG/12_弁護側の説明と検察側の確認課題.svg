<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>弁護側の説明と検察側の確認課題</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">12  弁護側の説明と検察側の確認課題</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">反対事情が、どの推論に影響するかを示す。</text>
