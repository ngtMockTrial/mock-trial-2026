<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>眼鏡の証拠から現場との接点へ</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">04  眼鏡の証拠から現場との接点へ</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">所有者の認定と、犯行時に装着していたという推認を区別する。</text>
