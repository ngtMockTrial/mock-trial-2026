<rect x="450" y="115" width="700" height="115" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="464" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">I　要証事実又は検討対象</text>
<text x="464" y="161.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">検察側の推認</text>
<text x="464" y="184.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">木村と犯行時の現場との接点がある</text>
<text x="464" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">この接点だけで刺突者が確定するわけではない</text>
<rect x="45" y="375" width="430" height="135" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="59" y="398" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F1　認定する事実</text>
<text x="59" y="423.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">発見された眼鏡は木村の物</text>
<text x="59" y="498" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4</text>
<rect x="585" y="375" width="430" height="135" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="599" y="398" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F2　認定する事実</text>
<text x="599" y="423.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">眼鏡に岸井由来の血液が付着</text>
<text x="599" y="498" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4</text>
<rect x="1125" y="375" width="430" height="135" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="1139" y="398" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F3　認定する事実</text>
<text x="1139" y="423.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">眼鏡は被害者近辺のB地点で発見</text>
<text x="1139" y="498" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3・6・11・14</text>
<rect x="35" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="49" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E3　証拠資料</text>
<text x="49" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">本人が所有を認めた</text>
<text x="49" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">指紋・皮膚片が一致</text>
<text x="49" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4</text>
<rect x="435" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="449" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">EB　証拠資料</text>
<text x="449" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">血液のDNA型が</text>
<text x="449" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井と一致</text>
<text x="449" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4</text>
<rect x="835" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="849" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">EP　証拠資料</text>
<text x="849" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">警察官による発見状況</text>
<text x="849" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">見取図と現場写真</text>
<text x="849" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3・6・11・14</text>
<rect x="1235" y="780" width="330" height="140" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="1249" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R　反対事情又は限界</text>
<text x="1249" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">昼に落とした後で</text>
<text x="1249" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">別人の犯行により血が付いた</text>
<text x="1249" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">弁護側の説明 p.34</text>
<rect x="160.0" y="613.0" width="140.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="166.0" y="632.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　所有を認定</text>
<rect x="536.0" y="636.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="542.0" y="655.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　血液の由来を認定</text>
<rect x="1018.0" y="631.0" width="204.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1024.0" y="650.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　現場での所在を認定</text>
<rect x="326.0" y="270.5" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="332.0" y="289.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　持ち主を結ぶ</text>
<rect x="722.0" y="270.5" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="728.0" y="289.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　被害者を結ぶ</text>
<rect x="1126.0" y="270.5" width="140.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1132.0" y="289.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　現場を結ぶ</text>
<rect x="1311.0" y="222.19999999999993" width="252.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1317.0" y="241.19999999999993" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　付着時刻・落下時刻に疑い</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">眼鏡の所有・発見位置・血液の由来は甲1が支える。付着時刻や装着中かどうかは未確定。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">血の模様から刺突時の装着や飛沫方向を科学的に断定する鑑定はない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">昼の落下説明と清掃証言の関係は図05。論告では実演結果に合わせて推認の強さを調整する。</text>
</svg>