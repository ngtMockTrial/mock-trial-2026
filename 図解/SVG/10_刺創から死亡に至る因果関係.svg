<rect x="480" y="115" width="640" height="115" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="494" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">D　要証事実又は検討対象</text>
<text x="494" y="161.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">要証事実</text>
<text x="494" y="184.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">岸井の刺創が死亡を引き起こした</text>
<text x="494" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">甲1 教材p.3の検案・死亡確認が根拠</text>
<rect x="45" y="405" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="59" y="428" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">W　認定する事実</text>
<text x="59" y="453.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">胸腹部・腕・右大腿部に</text>
<text x="59" y="480.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">複数の刺創があった</text>
<text x="59" y="538" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3</text>
<rect x="585" y="405" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="599" y="428" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">B　認定する事実</text>
<text x="599" y="453.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">これらの傷による</text>
<text x="599" y="480.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">出血性ショックが死因</text>
<text x="599" y="538" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3</text>
<rect x="1125" y="405" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="1139" y="428" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">T　認定する事実</text>
<text x="1139" y="453.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">搬送先で同日21時55分</text>
<text x="1139" y="480.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井の死亡を確認</text>
<text x="1139" y="538" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3</text>
<rect x="45" y="800" width="430" height="150" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="59" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E1A　証拠資料</text>
<text x="59" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">検案結果の創傷の記載</text>
<text x="59" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">左胸2・右上腹1・両腕複数・右大腿1</text>
<text x="59" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3 第2の2①</text>
<rect x="585" y="800" width="430" height="150" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="599" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E1B　証拠資料</text>
<text x="599" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">検案結果の死因の記載</text>
<text x="599" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">上記の傷による出血性ショック</text>
<text x="599" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3 第2の2③</text>
<rect x="1125" y="800" width="430" height="150" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="1139" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E1C　証拠資料</text>
<text x="1139" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">搬送と死亡確認の記載</text>
<text x="1139" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">五哲大学病院で21時55分</text>
<text x="1139" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3 第2の1</text>
<rect x="166.0" y="643.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="172.0" y="662.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　創傷の存在を認定</text>
<rect x="706.0" y="643.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="712.0" y="662.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　医学的死因を認定</text>
<rect x="1246.0" y="643.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1252.0" y="662.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　死亡の結果を認定</text>
<rect x="308.0" y="285.5" width="220.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="314.0" y="304.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　行為の結果としての傷</text>
<rect x="722.0" y="285.5" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="728.0" y="304.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　傷による死因</text>
