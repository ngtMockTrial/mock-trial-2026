<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>刺突行為から殺意を推認する</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">11  刺突行為から殺意を推認する</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">殺意の推認を、犯人性の立証から分けて整理する。</text>
<polyline points="260.0,800 260.0,545" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="260.0,545 265.0,557.0 255.0,557.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="800.0,800 800.0,545" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="800.0,545 805.0,557.0 795.0,557.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="1340.0,800 1340.0,545" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="1340.0,545 1345.0,557.0 1335.0,557.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="260.0,395 260.0,312.5 541.0,312.5 541.0,230" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="541.0,230 546.0,242.0 536.0,242.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="800.0,395 800.0,230" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="800.0,230 805.0,242.0 795.0,242.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="1340.0,395 1340.0,312.5 1059.0,312.5 1059.0,230" fill="none" stroke="#ad5148" stroke-width="2" stroke-dasharray="8 6"/>
<polyline points="1066.0,230.0 1052.0,230.0" stroke="#ad5148" fill="none" stroke-width="2"/>
<rect x="430" y="115" width="740" height="115" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="444" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">M　要証事実又は検討対象</text>
<text x="444" y="161.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">要証事実</text>
<text x="444" y="184.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">死亡の危険を認識し、容認して刺したという殺意</text>
<text x="444" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">検察側の推認。犯人性は別に立証する</text>
<rect x="45" y="395" width="430" height="150" fill="#edf7ef" stroke="#4e805a" stroke-width="2"/>
<text x="59" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">I1　検察側の推認</text>
<text x="59" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">生命に関わる胸腹部への刺突</text>
<text x="59" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">死亡の危険を理解し得る行為と評価</text>
<text x="59" y="533" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3からの検察側の評価</text>
<rect x="585" y="395" width="430" height="150" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="599" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">I2　認定する事実</text>
<text x="599" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">複数の部位に刺創</text>
<text x="599" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">一度の軽い接触とは異なる傷の状況</text>
<text x="599" y="533" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3</text>
<rect x="1125" y="395" width="430" height="150" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="1139" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R　反対事情又は限界</text>
<text x="1139" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">凶器・創の深さ・刺突順序は不明</text>
<text x="1139" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">具体的な刺し方を作って補わない</text>
<text x="1139" y="533" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">甲1 p.3及び記載の範囲</text>
<rect x="45" y="800" width="430" height="150" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="59" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E1X　証拠資料</text>
<text x="59" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">検案結果</text>
<text x="59" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">左胸2か所・右上腹1か所の刺創</text>
<text x="59" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3 第2の2①</text>
<rect x="585" y="800" width="430" height="150" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="599" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E1Y　証拠資料</text>
<text x="599" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">検案結果</text>
<text x="599" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">両腕複数・右大腿1か所の刺創</text>
<text x="599" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3 第2の2①</text>
<rect x="1125" y="800" width="430" height="150" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="1139" y="823" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E1Z　証拠資料</text>
<text x="1139" y="848.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">検案結果</text>
<text x="1139" y="875.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">凶器は刃物と考えられるが未発見</text>
<text x="1139" y="938" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3 第2の2②・3</text>
<rect x="166.0" y="640.5" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="172.0" y="659.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　部位を踏まえ評価</text>
<rect x="698.0" y="640.5" width="204.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="704.0" y="659.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　刺創の複数性を認定</text>
<rect x="1238.0" y="640.5" width="204.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1244.0" y="659.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　資料から分かる範囲</text>
<rect x="266.5" y="280.5" width="268.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="272.5" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　行為の危険性から意思を推認</text>
<rect x="682.0" y="280.5" width="236.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="688.0" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　行為の反復性を併せ評価</text>
<rect x="1129.5" y="280.5" width="140.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1135.5" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　推認の限界</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">ここで示すのは刺した者の意思の推認。木村が刺したことを、傷の存在だけで証明できるわけではない。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">凶器未発見。刃渡り・傷の深さ・力の強さ・刺突の順番を具体的に認定する資料はない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">両腕の刺創を防御創と断定したり、全ての傷が同じ深さだったと仮定したりしない。</text>
</svg>