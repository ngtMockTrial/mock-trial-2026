<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>共用自転車と使用者の推認</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">06  共用自転車と使用者の推認</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">事件との接点を示す事実と、木村が当日使用したという推認を分ける。</text>
<polyline points="200.0,780 200.0,655.0 260.0,655.0 260.0,530" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="260.0,530 265.0,542.0 255.0,542.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="600.0,780 600.0,655.0 692.5,655.0 692.5,530" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="692.5,530 697.5,542.0 687.5,542.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="1000.0,780 1000.0,655.0 929.0,655.0 929.0,530" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="929.0,530 934.0,542.0 924.0,542.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="1400.0,780 1400.0,655.0 1340.0,655.0 1340.0,530" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="1340.0,530 1345.0,542.0 1335.0,542.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="260.0,385 260.0,310.0 541.0,310.0 541.0,235" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="541.0,235 546.0,247.0 536.0,247.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="800.0,385 800.0,235" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="800.0,235 805.0,247.0 795.0,247.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="1340.0,385 1340.0,310.0 1059.0,310.0 1059.0,235" fill="none" stroke="#ad5148" stroke-width="2" stroke-dasharray="8 6"/>
<polyline points="1066.0,235.0 1052.0,235.0" stroke="#ad5148" fill="none" stroke-width="2"/>
<rect x="430" y="115" width="740" height="120" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="444" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">I　要証事実又は検討対象</text>
<text x="444" y="164.88" font-family="Meiryo, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">検察側の推認の検討</text>
<text x="444" y="192.6" font-family="Meiryo, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">木村が事件に関係して自転車を使った可能性</text>
<text x="444" y="223" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">当日の使用を断定できる証拠ではない</text>
<rect x="45" y="385" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="59" y="408" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F1　認定する事実</text>
<text x="59" y="433.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">自転車の右ハンドルに</text>
<text x="59" y="460.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井の血液が付いていた</text>
<text x="59" y="518" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4-5・8</text>
<rect x="585" y="385" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="599" y="408" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F2　認定する事実</text>
<text x="599" y="433.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">木村が普段使う自転車が</text>
<text x="599" y="460.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">自宅の共同住宅の駐輪場にあった</text>
<text x="599" y="518" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4-5、乙1 p.25</text>
<rect x="1125" y="385" width="430" height="145" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="1139" y="408" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">F3　反対事情又は限界</text>
<text x="1139" y="433.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">住民が共同使用・無施錠</text>
<text x="1139" y="460.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">外部からも出入り可能</text>
<text x="1139" y="518" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">甲1 p.4-5</text>
<rect x="35" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="49" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E4B　証拠資料</text>
<text x="49" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">自転車の血液の</text>
<text x="49" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">DNA型が岸井と一致</text>
<text x="49" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.5</text>
<rect x="435" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="449" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E4F　証拠資料</text>
<text x="449" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">複数の指紋の一部が</text>
<text x="449" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">木村と一致</text>
<text x="449" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.5</text>
<rect x="835" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="849" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E9　証拠資料</text>
<text x="849" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">買い物などで</text>
<text x="849" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">本件自転車を使うとの供述</text>
<text x="849" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">乙1 p.25。採用済み</text>
<rect x="1235" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="1249" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E4O　証拠資料</text>
<text x="1249" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">住民への聴き取り</text>
<text x="1249" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">他人の指紋は未特定</text>
<text x="1249" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4-5</text>
<rect x="136.0" y="623.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="142.0" y="642.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　血液の由来を認定</text>
<rect x="567.0" y="646.0" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="573.0" y="665.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　木村との接点</text>
<rect x="914.0" y="646.0" width="172.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="920.0" y="665.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　通常利用を認定</text>
<rect x="1284.0" y="623.0" width="172.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1290.0" y="642.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　第三者も使える</text>
<rect x="322.5" y="278.0" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="328.5" y="297.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　事件との接点</text>
<rect x="722.0" y="278.0" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="728.0" y="297.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　木村との接点</text>
<rect x="1081.5" y="278.0" width="236.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1087.5" y="297.0" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　使用者を一人に絞れない</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">血液の付着時刻・経緯や、犯行当日の使用者は特定されていない。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">指紋は通常の利用でも付く。他人の指紋があることを無視して「木村専用」と扱わない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">映像の自転車との同一性は未確定。図07の時刻・方向は補助事情として関連付ける。</text>
</svg>