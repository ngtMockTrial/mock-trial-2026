<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>防犯映像と移動の関係</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">07  防犯映像と移動の関係</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">映像は本人確認ではなく、時刻と進行方向の整合を考える補助事情。</text>
<polyline points="260.0,790 260.0,540" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="260.0,540 265.0,552.0 255.0,552.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="800.0,790 800.0,540" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="800.0,540 805.0,552.0 795.0,552.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="1555,860.0 1578,855 1578,170 1175,172.5" fill="none" stroke="#a87512" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="1175,172.5 1186.968752335208,167.42565594993258 1187.0307858810522,177.42546354004102" stroke="#a87512" fill="#a87512" stroke-width="2"/>
<polyline points="260.0,395 260.0,312.5 537.5,312.5 537.5,230" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="537.5,230 542.5,242.0 532.5,242.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="800.0,395 800.0,230" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="800.0,230 805.0,242.0 795.0,242.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="1340.0,395 1340.0,312.5 1062.5,312.5 1062.5,230" fill="none" stroke="#ad5148" stroke-width="2" stroke-dasharray="8 6"/>
<polyline points="1069.5,230.0 1055.5,230.0" stroke="#ad5148" fill="none" stroke-width="2"/>
<rect x="425" y="115" width="750" height="115" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="439" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">I　要証事実又は検討対象</text>
<text x="439" y="161.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">補助的な評価</text>
<text x="439" y="184.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">検察側が想定する移動の時刻・方向と整合する</text>
<text x="439" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">映像の人物が木村だという要証事実は証明しない</text>
<rect x="45" y="395" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="59" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F1　認定する事実</text>
<text x="59" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">20時32分頃</text>
<text x="59" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">男性が自転車で北から南へ進む</text>
<text x="59" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.5・10</text>
<rect x="585" y="395" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="599" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F2　認定する事実</text>
<text x="599" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">駐車場の南約200mにコンビニ</text>
<text x="599" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">木村宅は駐車場の南約400m</text>
<text x="599" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.6・13</text>
<rect x="1125" y="395" width="430" height="145" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="1139" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R　反対事情又は限界</text>
<text x="1139" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">顔が判別できない</text>
<text x="1139" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">押収自転車との同一性も未確定</text>
<text x="1139" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">甲1 p.5。特定を示す記載なし</text>
<rect x="45" y="790" width="430" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="59" y="813" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E5　証拠資料</text>
<text x="59" y="838.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">防犯カメラ映像と写真④</text>
<text x="59" y="918" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.5・10</text>
<rect x="585" y="790" width="430" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="599" y="813" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E7　証拠資料</text>
<text x="599" y="838.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">現場見取図1と距離の報告</text>
<text x="599" y="918" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.6・13</text>
<rect x="1125" y="790" width="430" height="140" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="1139" y="813" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">YTIME　主張又は要確認</text>
<text x="1139" y="838.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">犯行は20時30分頃</text>
<text x="1139" y="865.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">という起訴事実の主張</text>
<text x="1139" y="918" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">起訴状p.1。独立した時刻鑑定ではない</text>
<rect x="174.0" y="633.0" width="172.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="180.0" y="652.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　時刻と走行方向</text>
<rect x="714.0" y="633.0" width="172.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="720.0" y="652.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　南北の位置関係</text>
<rect x="1375.0" y="224.5" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1381.0" y="243.5" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　主張時刻との比較</text>
<rect x="288.75" y="280.5" width="220.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="294.75" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　時刻・進行方向を照合</text>
<rect x="706.0" y="280.5" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="712.0" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　自宅方向との整合</text>
<rect x="1091.25" y="280.5" width="220.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1097.25" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　本人特定には使えない</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">写真③は逮捕直後の木村の服装。事件当日の服装を示す証拠として用いない。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">起訴状の20時30分頃は検察の主張であり、映像から刺突時刻が判明したわけではない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">道路上の位置関係と映像の走行方向が整合しても、現場から木村宅へ帰ったことまでは確認できない。</text>
</svg>