<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>LINEから動機と所在の認識へ</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">08  LINEから動機と所在の認識へ</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">メッセージの存在、感情の推認、実際の殺害行為を分ける。</text>
<polyline points="260.0,790 260.0,540" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="260.0,540 265.0,552.0 255.0,552.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="800.0,790 800.0,540" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="800.0,540 805.0,552.0 795.0,552.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="1340.0,790 1340.0,540" fill="none" stroke="#4577a5" stroke-width="2"/>
<polygon points="1340.0,540 1345.0,552.0 1335.0,552.0" stroke="#4577a5" fill="#4577a5" stroke-width="2"/>
<polyline points="260.0,395 260.0,315.0 541.0,315.0 541.0,235" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="541.0,235 546.0,247.0 536.0,247.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="800.0,395 800.0,235" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="800.0,235 805.0,247.0 795.0,247.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<polyline points="1340.0,395 1340.0,315.0 1059.0,315.0 1059.0,235" fill="none" stroke="#4e805a" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="1059.0,235 1064.0,247.0 1054.0,247.0" stroke="#4e805a" fill="#4e805a" stroke-width="2"/>
<rect x="430" y="115" width="740" height="120" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="444" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">I　要証事実又は検討対象</text>
<text x="444" y="164.88" font-family="Meiryo, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">動機と場所の認識の推認</text>
<text x="444" y="192.6" font-family="Meiryo, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">岸井への怒りと、駐車場で会えるという認識</text>
<text x="444" y="223" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">犯人性を補助する事情。殺害の実行は別に立証</text>
<rect x="45" y="395" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="59" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F1　認定する事実</text>
<text x="59" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">交際解消後に</text>
<text x="59" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">復縁を求める送信が続いた</text>
<text x="59" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.17-19</text>
<rect x="585" y="395" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="599" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F2　認定する事実</text>
<text x="599" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">12月24日に岸井を</text>
<text x="599" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">許さない趣旨のメッセージ</text>
<text x="599" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.19</text>
<rect x="1125" y="395" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="1139" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">F3　認定する事実</text>
<text x="1139" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井を自宅近くの駐車場で</text>
<text x="1139" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">よく見ると送信した</text>
<text x="1139" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.19</text>
<rect x="45" y="790" width="430" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="59" y="813" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E81　証拠資料</text>
<text x="59" y="838.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">10月25日の別れの通告と</text>
<text x="59" y="865.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">10月26日以降のLINE履歴</text>
<text x="59" y="918" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.17-19</text>
<rect x="585" y="790" width="430" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="599" y="813" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E82　証拠資料</text>
<text x="599" y="838.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">12月24日18時台のLINE</text>
<text x="599" y="865.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井に対する怒りの表現</text>
<text x="599" y="918" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.19</text>
<rect x="1125" y="790" width="430" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="1139" y="813" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E83　証拠資料</text>
<text x="1139" y="838.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">12月24日18時14分のLINE</text>
<text x="1139" y="865.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">駐車場でよく見るとの記載</text>
<text x="1139" y="918" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.19</text>
<rect x="166.0" y="633.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="172.0" y="652.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　送信の内容を認定</text>
<rect x="706.0" y="633.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="712.0" y="652.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　怒りの表現を認定</text>
<rect x="1254.0" y="633.0" width="172.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1260.0" y="652.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4577a5">認定　記載内容を認定</text>
<rect x="314.5" y="283.0" width="172.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="320.5" y="302.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　未練という背景</text>
<rect x="722.0" y="283.0" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="728.0" y="302.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　岸井への感情</text>
<rect x="1129.5" y="283.0" width="140.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1135.5" y="302.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　場所の認識</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">岸井と本所の実際の交際をLINEだけで確定せず、木村がどう受け止めていたかを評価する。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">10月の復縁要求が、犯行日まで同じ強さで続いたと自動的に決めない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">怒りや未練は犯行そのものの証明ではなく、物的接点を検討する補助事情。</text>
</svg>