<text x="73.80000000000001" y="639.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　所在と血液から接点</text>
<rect x="498.0" y="646.0" width="204.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="504.0" y="665.0" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　昼の落下説明を検討</text>
<rect x="886.0" y="648.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="892.0" y="667.0" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　共用性を含め評価</text>
<rect x="1276.0" y="620.5" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1282.0" y="639.5" font-family="Meiryo, sans-serif" font-size="16" fill="#4e805a">推認　動機・場所の認識</text>
