<text x="534" y="143" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">P　要証事実又は検討対象</text>
<text x="534" y="166.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">要証事実</text>
<text x="534" y="189.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">岸井を刺した人物は木村である</text>
<text x="534" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">検察側が立証する中心争点</text>
<rect x="45" y="380" width="430" height="145" fill="#edf7ef" stroke="#4e805a" stroke-width="2"/>
<text x="59" y="403" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">I1　検察側の推認</text>
<text x="59" y="428.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">犯行時の現場との接点</text>
<text x="59" y="455.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">眼鏡の所在・血液と落下時刻を評価</text>
<text x="59" y="513" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">詳細 図04-05</text>
<rect x="585" y="380" width="430" height="145" fill="#edf7ef" stroke="#4e805a" stroke-width="2"/>
<text x="599" y="403" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">I2　検察側の推認</text>
<text x="599" y="428.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">自転車利用の可能性</text>
<text x="599" y="455.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">血液・通常利用・移動方向を評価</text>
<text x="599" y="513" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">詳細 図06-07</text>
<rect x="1125" y="380" width="430" height="145" fill="#edf7ef" stroke="#4e805a" stroke-width="2"/>
<text x="1139" y="403" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">I3　検察側の推認</text>
<text x="1139" y="428.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">被害者を対象とする背景</text>
<text x="1139" y="455.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">怒りと駐車場の認識を評価</text>
<text x="1139" y="513" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">詳細 図08</text>
<rect x="35" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="49" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E2　証拠資料</text>
<text x="49" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">木村の眼鏡が現場にあり</text>
<text x="49" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井の血液が付いていた</text>
<text x="49" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.3-4・7</text>
<rect x="435" y="780" width="330" height="140" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="449" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">E10　主張又は要確認</text>
<text x="449" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">18時頃の清掃と</text>
<text x="449" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">眼鏡を見なかったとの説明</text>
<text x="449" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">甲3 p.22。実演で要確認</text>
<rect x="835" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="849" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E4　証拠資料</text>
<text x="849" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">共用自転車の岸井の血液</text>
<text x="849" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">木村も普段利用</text>
<text x="849" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1 p.4-5・8、乙1 p.25</text>
<rect x="1235" y="780" width="330" height="140" fill="#f4f5f7" stroke="#7f8a96" stroke-width="2"/>
<text x="1249" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">E8　証拠資料</text>
<text x="1249" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">12月24日のLINE</text>
<text x="1249" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">岸井を許さない・駐車場で見る</text>
<text x="1249" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲2 p.19</text>
