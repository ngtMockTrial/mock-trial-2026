<rect x="410" y="115" width="780" height="120" fill="#203f59" stroke="#203f59" stroke-width="2"/>
<text x="424" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">I　要証事実又は検討対象</text>
<text x="424" y="164.88" font-family="Meiryo, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">条件付きの推認</text>
<text x="424" y="192.6" font-family="Meiryo, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">昼からB地点に眼鏡が残っていたとの説明は採りにくい</text>
<text x="424" y="223" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">見落とし・移動の可能性も含めて判断</text>
<rect x="45" y="390" width="430" height="145" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="59" y="413" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">P1　主張又は要確認</text>
<text x="59" y="438.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">18時頃の清掃で</text>
<text x="59" y="465.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">眼鏡を見なかったとの証言</text>
<text x="59" y="523" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">準備：甲3 p.22</text>
<rect x="585" y="390" width="430" height="145" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="599" y="413" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">P2　主張又は要確認</text>
<text x="599" y="438.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">B地点にあれば</text>
<text x="599" y="465.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">発見できたといえる観察条件</text>
<text x="599" y="523" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">実演で具体的に確認する</text>
<rect x="1125" y="390" width="430" height="145" fill="#fff0ef" stroke="#af554c" stroke-width="2"/>
<text x="1139" y="413" font-family="Meiryo, sans-serif" font-size="14" fill="#662e29">R　反対事情又は限界</text>
<text x="1139" y="438.6" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">見落としの可能性</text>
<text x="1139" y="465.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">日没後・急ぎ・車や物の陰</text>
<text x="1139" y="523" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">甲1 p.6、準備：甲3 p.21-22</text>
<rect x="35" y="780" width="330" height="140" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="49" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">S　主張又は要確認</text>
<text x="49" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">清掃の経路と向き</text>
<text x="49" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">B地点への接近と確認範囲</text>
<text x="49" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">準備：甲3 p.22</text>
<rect x="435" y="780" width="330" height="140" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="449" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">V　主張又は要確認</text>
<text x="449" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">照明と地面の見え方</text>
<text x="449" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">視力1.0という説明</text>
<text x="449" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">甲1 p.6・12-14、甲3 p.22</text>
<rect x="835" y="780" width="330" height="140" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="849" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">Q　主張又は要確認</text>
<text x="849" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">故障対応で作業が遅れ</text>
<text x="849" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">19時の家族の約束で急ぐ</text>
<text x="849" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">準備：甲3 p.21-22</text>
<rect x="1235" y="780" width="330" height="140" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="1249" y="803" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">K　主張又は要確認</text>
<text x="1249" y="828.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">木村の落下説明</text>
<text x="1249" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">記憶か、翌日の推測か</text>
<text x="1249" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">準備：乙2 p.28-29</text>
<rect x="311.2" y="280.5" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="317.2" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　未発見という証言</text>
<rect x="701.7" y="280.5" width="220.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="707.7" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　発見できる条件が必要</text>
<rect x="1140.2" y="280.5" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1146.2" y="299.5" font-family="Meiryo, sans-serif" font-size="16" fill="#ad5148">反対　推認を弱める</text>
<rect x="280.0" y="646.0" width="140.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="286.0" y="665.0" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　範囲を確認</text>
<rect x="632.0" y="651.0" width="156.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="638.0" y="670.0" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　見え方を確認</text>
<rect x="1096.0" y="651.0" width="188.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1102.0" y="670.0" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　注意の程度を検討</text>
<rect x="1327.0" y="228.5" width="236.0" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1333.0" y="247.5" font-family="Meiryo, sans-serif" font-size="16" fill="#a87512">条件　落下説明との整合を検討</text>
<rect x="35" y="968" width="18" height="18" fill="#203f59" stroke="#203f59" stroke-width="1"/>
<text x="61" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">検討対象</text>
<rect x="245" y="968" width="18" height="18" fill="#eef5fc" stroke="#4577a5" stroke-width="1"/>
<text x="271" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">認定する事実</text>
<rect x="475" y="968" width="18" height="18" fill="#f4f5f7" stroke="#7f8a96" stroke-width="1"/>
<text x="501" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">証拠資料</text>
<rect x="690" y="968" width="18" height="18" fill="#edf7ef" stroke="#4e805a" stroke-width="1"/>
<text x="716" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">推認</text>
<rect x="900" y="968" width="18" height="18" fill="#fff6e3" stroke="#b17b1a" stroke-width="1"/>
<text x="926" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">主張・要確認</text>
<rect x="1120" y="968" width="18" height="18" fill="#fff0ef" stroke="#af554c" stroke-width="1"/>
<text x="1146" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">反対事情・限界</text>
<rect x="1380" y="968" width="18" height="18" fill="#f2eff8" stroke="#806b9c" stroke-width="1"/>
<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">甲3は採否留保。以下の清掃内容は準備情報であり、実演で同内容の証言が得られた場合に評価する。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">18時50分の退勤記録は甲1 p.5。B地点の観察範囲・18時到着・滞在時間までは証明しない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">観察範囲が曖昧なら「清掃後に落ちた」と断定せず、論告の清掃段落Bへ変更する。</text>
