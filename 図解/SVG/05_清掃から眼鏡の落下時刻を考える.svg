<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>清掃から眼鏡の落下時刻を考える</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">05  清掃から眼鏡の落下時刻を考える</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">見なかったことから存在しなかったと推認するには、発見できる条件が必要。</text>
