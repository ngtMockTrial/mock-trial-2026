<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">14時15分頃の転倒・眼鏡落下は本人の説明の準備情報。18時頃の清掃も実演で確認する。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">20時30分頃は起訴状の犯行時刻の主張。独立の時刻鑑定として扱わない。</text>
