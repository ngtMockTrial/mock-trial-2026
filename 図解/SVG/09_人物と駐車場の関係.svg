<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>人物と駐車場の関係</title><rect width="1600" height="1130" fill="white"/>
<text x="35" y="54" font-family="Meiryo, sans-serif" font-size="31" fill="#17283b" font-weight="bold">09  人物と駐車場の関係</text>
<text x="35" y="94" font-family="Meiryo, sans-serif" font-size="19" fill="#17283b">人物間の関係と、現場を知る立場を示す。各線は犯行の証明を意味しない。</text>
