<text x="1249" y="855.0" font-family="Meiryo, sans-serif" font-size="20" fill="#662e29">立証予定の主張</text>
<text x="1249" y="908" font-family="Meiryo, sans-serif" font-size="13.5" fill="#662e29">教材p.1・32-35</text>
