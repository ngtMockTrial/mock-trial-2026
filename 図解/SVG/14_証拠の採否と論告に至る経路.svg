<text x="414" y="138" font-family="Meiryo, sans-serif" font-size="14" fill="#ffffff">U　要証事実又は検討対象</text>
<text x="414" y="161.04" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">論告で根拠として使う事実と推認</text>
<text x="414" y="184.79999999999998" font-family="Meiryo, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">採用済み証拠と、実演で確認した供述に基づく</text>
<text x="414" y="218" font-family="Meiryo, sans-serif" font-size="13.5" fill="#ffffff">証拠の採否：教材p.2</text>
<rect x="45" y="395" width="430" height="145" fill="#eef5fc" stroke="#4577a5" stroke-width="2"/>
<text x="59" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#17283b">A　認定する事実</text>
<text x="59" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">採用された書証</text>
<text x="59" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#17283b">内容が支える範囲で事実を認定</text>
<text x="59" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#17283b">甲1・甲2・乙1</text>
<rect x="585" y="395" width="430" height="145" fill="#fff6e3" stroke="#b17b1a" stroke-width="2"/>
<text x="599" y="418" font-family="Meiryo, sans-serif" font-size="14" fill="#49350c">P　主張又は要確認</text>
<text x="599" y="443.6" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">大滝の実際の法廷証言</text>
<text x="599" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">B地点の観察状況を記録</text>
<text x="599" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">証人として採用。実際の発言を確認</text>
