<text x="1406" y="985" font-family="Meiryo, sans-serif" font-size="15" fill="#17283b">人物・場所</text>
<text x="35" y="1033" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">根拠：教材p.2の証拠整理メモ。実演で採否や取調べについて説明があれば、その内容を記録する。</text>
<text x="35" y="1058" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">冒頭陳述と起訴状は主張の範囲を示す。記載されているだけで事実の証明にはならない。</text>
<text x="35" y="1083" font-family="Meiryo, sans-serif" font-size="15.5" fill="#17283b">甲3・乙2の調書を、確認なしに採用済み証拠へ変更しない。実演の発言を別途記録して使う。</text>
