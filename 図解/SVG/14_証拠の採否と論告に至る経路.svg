<text x="1139" y="470.0" font-family="Meiryo, sans-serif" font-size="20" fill="#49350c">落下・所在・利用の説明を記録</text>
<text x="1139" y="528" font-family="Meiryo, sans-serif" font-size="13.5" fill="#49350c">被告人質問で実際の発言を確認</text>
