<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模擬裁判・構造グラフ</title><style>.trial-graph { --tg-blue:#3978b7; --tg-red:#be5364; --tg-gray:#71818b; --tg-border:var(--background-modifier-border,#cdd4db); --tg-bg:var(--background-primary,#fff); --tg-ink:var(--text-normal,#25323d); color:var(--tg-ink); background:var(--tg-bg); font:15px/1.6 var(--font-interface,"Yu Gothic UI","Meiryo",sans-serif); padding:20px; height:100%; box-sizing:border-box; display:flex; flex-direction:column; overflow:auto; container-type:inline-size; container-name:trial-graph; }
body:has(> #graph) { margin:0; height:100vh; }
.tg-heading h2 { font-size:24px; margin:0 0 4px; }
.tg-heading p,.tg-legend { margin:4px 0 12px; }
.tg-toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; padding:12px 0; border-block:1px solid var(--tg-border); }
.trial-graph input,.trial-graph select,.trial-graph button { font:inherit; color:inherit; border:1px solid var(--tg-border); border-radius:5px; background:var(--tg-bg); padding:6px 9px; min-height:36px; }
.trial-graph input[type=search] { width:210px; }
.trial-graph input[type=range] { width:95px; min-height:20px; padding:0; }
.trial-graph input[type=checkbox] { min-height:0; }
.trial-graph button { cursor:pointer; }
.trial-graph button:hover { background:var(--background-secondary,#edf2f6); }
.trial-graph :focus-visible { outline:3px solid var(--tg-blue); outline-offset:3px; }
.tg-legend,.tg-count { font-size:13px; }
.tg-count { margin:0 0 8px; }
.tg-body { display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:0; flex:1; border:1px solid var(--tg-border); border-radius:6px; overflow:hidden; }
.tg-viewport { min-width:0; overflow:auto; background:var(--tg-bg); }
.tg-detail { padding:18px; overflow:auto; border-left:1px solid var(--tg-border); background:var(--background-secondary,#f4f6f8); }
.tg-detail h3 { margin:0 0 14px; font-size:19px; line-height:1.5; }
.tg-detail h4 { margin:20px 0 8px; }
.tg-detail p { overflow-wrap:anywhere; }
.tg-meta { font-size:13px; }
.tg-connection { display:block; width:100%; text-align:left; margin-bottom:7px; white-space:normal; height:auto; line-height:1.5; }
.tg-node { cursor:pointer; }
.tg-node:hover > :first-child { stroke-width:4; fill-opacity:.25; }
.tg-node:focus { outline:none; }
.tg-node:focus-visible > :first-child { stroke-width:5; }
.tg-edge-label { paint-order:stroke; stroke:var(--tg-bg); stroke-width:5px; stroke-linejoin:round; }
.tg-stale { padding:10px; color:var(--text-normal,#25323d); background:var(--background-modifier-warning, #fff0ca); border-left:4px solid #a77c14; }
@container trial-graph (max-width:900px) { .tg-body { grid-template-columns:1fr; min-height:0; flex:none; } .tg-viewport { height:58vh; } .tg-detail { border-left:0; border-top:1px solid var(--tg-border); max-height:55vh; } }
@media(max-width:800px) { .trial-graph { padding:12px; overflow:auto; height:auto; min-height:100%; } .tg-body { grid-template-columns:1fr; min-height:0; flex:none; } .tg-viewport { height:65vh; } .tg-detail { border-left:0; border-top:1px solid var(--tg-border); max-height:55vh; } .tg-heading h2 { font-size:21px; } .tg-toolbar { gap:8px; } .trial-graph button,.trial-graph select { min-height:44px; } }
</style><body><main id="graph"></main><script>/* Browser-compatible view. All note text is inserted with textContent, never HTML. */
(function(root){
  const NS='http://www.w3.org/2000/svg';
  const COLORS={'検察':'#3978b7','弁護':'#be5364','共通':'#71818b'};
  const ROWS=[['最終目標',['最終結論']],['要証事実',['要証事実']],['推認・反論',['推認','反論']],['事実命題',['間接事実']],['証拠',['証拠']],['確認課題',['確認課題']],['準備専用・未獲得',['準備資料','供述獲得候補']]];
  const RELS={inputs:'支持',challenges:'反論',checks:'確認',preparation:'準備のみ',potential_supports:'将来候補'};
  function el(tag,attrs={},text){const e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>k==='class'?e.className=v:e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
  function svg(tag,attrs={},text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
  function layout(nodes){
    const positions={},rows=[];let y=72;
    ROWS.forEach(([label,kinds])=>{
      const members=nodes.filter(n=>kinds.includes(n.kind));
      const max=Math.max(1,...['検察','共通','弁護'].map(side=>members.filter(n=>n.side===side).length));
      const height=label==='最終目標'?210:Math.ceil(max/2)*174+50;
      rows.push({label,y,height});
      ['検察','共通','弁護'].forEach((side,lane)=>{
        members.filter(n=>n.side===side).sort((a,b)=>b.priority-a.priority||a.id.localeCompare(b.id)).forEach((n,i)=>{
          positions[n.id]={x:label==='最終目標'?285:190+lane*440+(i%2)*200,y:y+85+Math.floor(i/2)*174};
        });
      }); y+=height;
    });return {positions,rows,height:y+20};
  }
  function mount(host,data,open){
    host.replaceChildren();host.classList.add('trial-graph');
    const COLORS=host.closest('.theme-dark')?{'検察':'#77b9fb','弁護':'#f18c9a','共通':'#a4b3bf'}:{'検察':'#286398','弁護':'#a93850','共通':'#536572'};
    let selected=null,zoom=.8,query='',side='すべて',kind='すべて',relation='すべて',neighborhood=false;
    const byid=Object.fromEntries(data.nodes.map(n=>[n.id,n]));
    const top=el('header',{class:'tg-heading'});host.append(top);
    top.append(el('h2',{},'模擬裁判の論証構造'),el('p',{},'大きさ＝表示上の重要度 ／ 色＝立場 ／ 形＝種類。事実命題も認定済みとは限りません。'));
    const stale=el('p',{class:'tg-stale',hidden:''},'正本に変更があります。「検討を更新.cmd」を実行してください。この図は更新前の内容です。');host.append(stale);
    const toolbar=el('div',{class:'tg-toolbar'});host.append(toolbar);
    function select(label,values,change){const wrap=el('label',{},label+' '),s=el('select',{'aria-label':label});values.forEach(v=>s.append(el('option',{value:v},v)));s.addEventListener('change',()=>{change(s.value);render();});wrap.append(s);toolbar.append(wrap);return s;}
    const search=el('input',{type:'search',name:'trial-search',autocomplete:'off',placeholder:'ID・主張・情報源を検索…','aria-label':'ノートを検索'});toolbar.append(search);search.addEventListener('input',()=>{query=search.value.toLowerCase();render();});
    select('立場',['すべて','検察','弁護','共通'],v=>side=v);
    select('種類',['すべて',...new Set(data.nodes.map(n=>n.kind))],v=>kind=v);
    select('線',['すべて',...Object.values(RELS)],v=>relation=v);
    const near=el('label'),check=el('input',{type:'checkbox'});near.append(check,document.createTextNode(' 選択点の周辺のみ'));toolbar.append(near);check.addEventListener('change',()=>{neighborhood=check.checked;render();});
    const zoomLabel=el('label',{},'拡大 '),range=el('input',{type:'range',min:'.4',max:'1.6',step:'.1',value:'.8','aria-label':'グラフの拡大率'});zoomLabel.append(range);toolbar.append(zoomLabel);range.addEventListener('input',()=>{zoom=Number(range.value);size();});
    const reset=el('button',{type:'button'},'選択解除');toolbar.append(reset);reset.onclick=()=>{selected=null;render();detail();};
    host.append(el('p',{class:'tg-legend'},'青＝検察　灰＝共通　赤＝弁護 ｜ ◎目標　六角形＝要証事実　◇推認　△反論　○事実命題　□証拠　?確認　破線枠＝準備・供述候補 ｜ 緑の小札＝採用資料、黄の小札＝留保・未獲得・条件付き'));
    const count=el('div',{class:'tg-count','aria-live':'polite'});host.append(count);
    const body=el('div',{class:'tg-body'}),viewport=el('div',{class:'tg-viewport',tabindex:'0','aria-label':'構造グラフ。スクロールで移動。点を選択すると接続を表示。'}),panel=el('aside',{class:'tg-detail','aria-label':'選択したノートの詳細'});host.append(body);body.append(viewport,panel);
    const canvas=svg('svg',{role:'group','aria-label':'立場と種類で区切った論証グラフ'});viewport.append(canvas);
    const fit=el('button',{type:'button'},'全幅に合わせる');toolbar.append(fit);
    fit.onclick=()=>{zoom=Math.max(.4,Math.min(1.6,(viewport.clientWidth-16)/1370));range.value=String(zoom);size();};
    let currentHeight=1000;
    function size(){canvas.setAttribute('width',1370*zoom);canvas.setAttribute('height',currentHeight*zoom);}
    function choose(id){selected=id;render();detail();}
    function detail(){
      panel.replaceChildren();
      if(!selected){panel.append(el('h3',{},'点を選ぶと根拠を読めます'),el('p',{},'関係する線だけを強調します。正本を開いて、出典・前提・反論・人のレビューを編集できます。'),el('p',{},'T00は検察側の最終立証目標です。弁護側には無実の証明や真犯人の特定を要求しません。'));return;}
      const n=byid[selected];panel.append(el('h3',{},n.id+' '+n.title),el('p',{class:'tg-meta'},n.side+' ／ '+n.kind+' ／ 重要度 '+n.priority),el('p',{},'資料・命題の状態：'+n.status),el('p',{},'利用状態：'+n.availability),el('p',{},'人のレビュー：'+n.review),el('p',{},n.summary));
      const button=el('button',{type:'button'},'正本・出典・レビューを開く');button.onclick=()=>open(n.path);panel.append(button);
      const edges=data.edges.filter(e=>e.source===selected||e.target===selected);
      for(const incoming of [true,false]){
        const part=edges.filter(e=>incoming?e.target===selected:e.source===selected);
        panel.append(el('h4',{},incoming?'この点へ向かう関係':'この点から向かう関係'));
        if(!part.length)panel.append(el('p',{},'なし'));
        part.forEach(e=>{const id=incoming?e.source:e.target,b=el('button',{type:'button',class:'tg-connection'},e.label+'：'+id+' '+byid[id].title);b.onclick=()=>choose(id);panel.append(b);});
      }
      panel.append(el('p',{class:'tg-meta'},'準備・将来候補の線は現在の支持に数えません。関係の編集は正本の属性で行います。'));
    }
    function render(){
      let nodes=data.nodes.filter(n=>(side==='すべて'||n.side===side)&&(kind==='すべて'||n.kind===kind)&&(!query||[n.id,n.title,...n.sources].join(' ').toLowerCase().includes(query)));
      if(neighborhood&&selected){const ids=new Set([selected]);data.edges.filter(e=>e.source===selected||e.target===selected).forEach(e=>{ids.add(e.source);ids.add(e.target);});nodes=nodes.filter(n=>ids.has(n.id));}
      const visible=new Set(nodes.map(n=>n.id));
      const edges=data.edges.filter(e=>visible.has(e.source)&&visible.has(e.target)&&(relation==='すべて'||RELS[e.field]===relation));
      const grid=layout(nodes);currentHeight=grid.height;canvas.setAttribute('viewBox','0 0 1370 '+currentHeight);canvas.replaceChildren();size();
      count.textContent=nodes.length+' / '+data.nodes.length+'命題・資料、'+edges.length+'関係を表示。上下へスクロールできます。';
      const defs=svg('defs');canvas.append(defs);
      ['#84929d','#be5364','#a77c14'].forEach((color,i)=>{const marker=svg('marker',{id:'tg-arrow-'+i,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M0 0 L10 5 L0 10 Z',fill:color}));defs.append(marker);});
      ['検察','共通','弁護'].forEach((s,i)=>{canvas.append(svg('rect',{x:90+i*440,y:0,width:430,height:currentHeight,fill:COLORS[s],'fill-opacity':.045}));canvas.append(svg('text',{x:305+i*440,y:35,'text-anchor':'middle',fill:COLORS[s],'font-size':24,'font-weight':700},s==='共通'?'双方共通の資料・事実命題':s+'側'));});
      grid.rows.forEach(r=>{canvas.append(svg('line',{x1:90,y1:r.y,x2:1370,y2:r.y,stroke:'#89959e','stroke-opacity':.3}));const label=svg('text',{x:14,y:r.y+28,'font-size':15,fill:'currentColor'});Array.from(r.label).forEach((c,i)=>label.append(svg('tspan',{x:24,dy:i?20:0},c)));canvas.append(label);});
      edges.forEach(e=>{
        const a=grid.positions[e.source],b=grid.positions[e.target],na=byid[e.source],nb=byid[e.target];
        const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1;
        const x1=a.x+dx/length*(na.radius+7),y1=a.y+dy/length*(na.radius+7),x2=b.x-dx/length*(nb.radius+9),y2=b.y-dy/length*(nb.radius+9);
        const active=selected&&(e.source===selected||e.target===selected),warning=e.conditional||['preparation','potential_supports','checks'].includes(e.field);
        const index=e.field==='challenges'?1:warning?2:0,color=['#84929d','#be5364','#a77c14'][index];
        const path=svg('path',{d:`M ${x1} ${y1} Q ${(x1+x2)/2+40} ${(y1+y2)/2} ${x2} ${y2}`,fill:'none',stroke:color,'stroke-width':active?3:1.5,'stroke-opacity':selected?(active?.9:.08):.24,'stroke-dasharray':warning?'7 5':'none','marker-end':`url(#tg-arrow-${index})`,'data-field':e.field});
        path.append(svg('title',{},e.source+' → '+e.target+'：'+e.label));canvas.append(path);
        if(active)canvas.append(svg('text',{x:(x1+x2)/2+24,y:(y1+y2)/2-7,fill:color,'font-size':15,class:'tg-edge-label'},e.label));
      });
      nodes.forEach(n=>{
        const p=grid.positions[n.id],r=n.radius,c=COLORS[n.side],g=svg('g',{transform:`translate(${p.x} ${p.y})`,tabindex:0,role:'button','aria-label':n.id+' '+n.title+'、'+n.side+'、'+n.kind,'data-id':n.id,'data-radius':r,class:'tg-node'});
        const pending=['pending','candidate','conditional'].includes(n.state);
        let shape;const attrs={fill:c,'fill-opacity':selected===n.id?.28:.12,stroke:c,'stroke-width':selected===n.id?4:2};
        if(['証拠','準備資料','供述獲得候補'].includes(n.kind)){shape=svg('rect',{x:-r,y:-r,width:r*2,height:r*2,rx:n.kind==='証拠'?3:10,...attrs});if(n.kind!=='証拠')shape.setAttribute('stroke-dasharray','5 4');}
        else if(n.kind==='推認')shape=svg('polygon',{points:`0,${-r} ${r},0 0,${r} ${-r},0`,...attrs});
        else if(n.kind==='反論')shape=svg('polygon',{points:`0,${-r} ${r},${r*.8} ${-r},${r*.8}`,...attrs});
        else if(n.kind==='要証事実')shape=svg('polygon',{points:`${-r},0 ${-r/2},${-r*.86} ${r/2},${-r*.86} ${r},0 ${r/2},${r*.86} ${-r/2},${r*.86}`,...attrs});
        else shape=svg('circle',{r,...attrs});
        g.append(shape);if(n.id==='T00')g.append(svg('circle',{r:r-7,fill:'none',stroke:c,'stroke-width':2}));
        g.append(svg('text',{'text-anchor':'middle',dy:6,fill:c,'font-size':n.priority>=4?21:16,'font-weight':700},n.kind==='確認課題'?'? '+n.id:n.id));
        const title=n.title.match(/.{1,12}/gu)||[];title.forEach((t,i)=>g.append(svg('text',{'text-anchor':'middle',y:r+24+i*18,fill:'currentColor','font-size':15,'font-weight':n.priority>=4?700:400},t)));
        const badge=n.state==='available'?'採用資料':pending?(n.state==='candidate'?'未獲得':n.state==='pending'?'採否留保':'条件付き'):n.kind;
        g.append(svg('text',{'text-anchor':'middle',y:-r-12,fill:pending?'#8b670d':n.state==='available'?'#287146':c,'font-size':13,'font-weight':600},badge));
        g.append(svg('title',{},n.title+'\n'+n.kind+'・'+n.side+'\n'+n.availability));
        g.addEventListener('click',()=>choose(n.id));g.addEventListener('dblclick',()=>open(n.path));g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose(n.id);}});canvas.append(g);
      });
    }
    render();detail();fit.click();
    return {stale:()=>stale.removeAttribute('hidden'),destroy:()=>host.replaceChildren()};
  }
  const api={mount,layout};if(typeof module!=='undefined')module.exports=api;else root.TrialGraph=api;

</script><script>TrialGraph.mount(document.getElementById("graph"),{"schema": 2, "nodes": [{"id": "D01", "title": "見なかったことは不在の証明か", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "conditional", "availability": "条件付き・未確認の前提あり：E07", "sources": ["清掃供述", "現場配置"], "summary": "観察条件・確認範囲が不明なら、見落としの余地が残る。\n\n\n実際に見落としたと断定しない。大滝の具体的証言を確認する。", "path": "検討/ノート/D01.md"}, {"id": "D02", "title": "昼の紛失と別の機会の付着", "kind": "反論", "side": "弁護", "status": "仮説", "review": "未レビュー", "priority": 3, "radius": 32, "state": "conditional", "availability": "条件付き・未確認の前提あり：E09", "sources": ["被告人供述"], "summary": "昼に落とした後に血液が付いたという別の説明を、証拠と照合する。\n\n\nその機序が起きた証明は未了。本人の落下記憶自体も推測を含み、法廷未確認。", "path": "検討/ノート/D02.md"}, {"id": "D03", "title": "所有物の存在と行為者は別", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["眼鏡"], "summary": "眼鏡の所有と血液付着から、着用中の木村の刺突までには追加の推論がある。\n\n\n第三者による移動等を事実として創作せず、どの段階に疑問があるか明示する。", "path": "検討/ノート/D03.md"}, {"id": "D04", "title": "共用なら通常利用で指紋を説明できる", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["自転車"], "summary": "複数人利用・無施錠・外部出入りがあり、指紋だけで事件時の利用者を特定できない。\n\n\n第三者が犯人と特定されたことにはならない。被害者血液の意味も評価する。", "path": "検討/ノート/D04.md"}, {"id": "D05", "title": "映像の人物と自転車を特定できるか", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["防犯映像"], "summary": "顔は判別できず、服装・体格の整合だけで同一人物とはならない。車両の同一性も別。\n\n\n違う人物だと証明されたわけでもない。整合性がもつ限られた意味を評価する。", "path": "検討/ノート/D05.md"}, {"id": "D06", "title": "怒りは犯行実行を意味しない", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["LINE"], "summary": "怒りと所在の認識があっても、犯行の実行や具体的計画を直接示さない。\n\n\n動機の補助的価値までゼロと決めつけない。", "path": "検討/ノート/D06.md"}, {"id": "D07", "title": "殺意の推認には傷と行為状況の限界", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["検案"], "summary": "傷の深さや行為の経緯は記載されず、わかる範囲で推論を評価する。\n\n\n胸腹部への複数刺創という不利な事情も検討する。", "path": "検討/ノート/D07.md"}, {"id": "D08", "title": "同じ情報源と未確定の前提を重ねていないか", "kind": "反論", "side": "弁護", "status": "反論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["総合評価"], "summary": "カード数を独立した証拠数にせず、眼鏡・自転車・映像を結ぶ前提を一つずつ確認する。\n\n\n疑問を並べるだけでなく、証拠全体の説明力も評価する。", "path": "検討/ノート/D08.md"}, {"id": "D09", "title": "有罪とする証明に合理的な疑いが残らないか", "kind": "反論", "side": "弁護", "status": "最終結論への検討課題", "review": "未レビュー", "priority": 4, "radius": 42, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["総合評価"], "summary": "犯人性・殺意・因果関係の各枝と、それらの総合評価に合理的な疑いが残るかを検討する。\n\n弁護側は検察側の最終結論を争う。無実や真犯人を積極的に証明することを条件にはしない。", "path": "検討/ノート/D09.md"}, {"id": "E01", "title": "刺創と死因の報告", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["検案"], "summary": "甲1は胸・腹・腕・大腿部の刺創と、これらの傷による出血性ショック死を報告する。\n\n\n深さ・順序・刃物の寸法・行為者の特定は別問題。", "path": "検討/ノート/E01.md"}, {"id": "E02", "title": "眼鏡の発見と所有の裏付け", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["眼鏡"], "summary": "現場Bで眼鏡を発見。木村の遺失物との認め、指紋・皮膚片DNA型、購入記録がある。\n\n\n落下時刻、着用者、付着経緯は確定しない。", "path": "検討/ノート/E02.md"}, {"id": "E03", "title": "眼鏡の血痕DNA型の報告", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["眼鏡"], "summary": "眼鏡の血痕について、岸井のDNA型と一致するとの報告。\n\n\nE02と同じ眼鏡。独立した物証の数を増やさない。", "path": "検討/ノート/E03.md"}, {"id": "E04", "title": "血痕付き共用自転車", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["自転車"], "summary": "自転車に岸井の血痕と木村を含む複数人の指紋。共用・無施錠で、外部者も駐輪場に出入り可能。\n\n\n指紋の付着時刻、当日使用者、他人の指紋の主は不明。", "path": "検討/ノート/E04.md"}, {"id": "E05", "title": "20時32分頃の防犯映像", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["防犯映像"], "summary": "黒いダウンの中肉中背の男性が、自転車で北から南へ通過。マスクで顔は判別不能。\n\n\n写真③は逮捕直後。映像人物と木村、車両と押収自転車の同一性は未確定。", "path": "検討/ノート/E05.md"}, {"id": "E06", "title": "別れと岸井への怒りのLINE", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["LINE"], "summary": "復縁を求める送信、岸井への怒り、駐車場でよく見るとの発言が記録される。\n\n\n交際の実態や殺害計画、実行を直接示すものではない。", "path": "検討/ノート/E06.md"}, {"id": "E07", "title": "大滝の清掃調書", "kind": "準備資料", "side": "共通", "status": "採否留保", "review": "未レビュー", "priority": 2, "radius": 23, "state": "pending", "availability": "現時点は根拠に不可・採否留保調書", "sources": ["清掃供述"], "summary": "18時頃に清掃し、隅々まで確認したが眼鏡を見ていないという調書記載。\n\n\n実際の法廷証言は未確認。急いでいた事情・暗さ・確認範囲も検討する。", "path": "検討/ノート/E07.md"}, {"id": "E08", "title": "退勤時刻と昼の店舗利用", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["退勤記録", "店舗利用"], "summary": "大滝の18時50分退勤と、木村が14時頃お好み焼き店を訪れた捜査結果。\n\n\n退勤記録は清掃範囲を、店への訪問は飲酒量・帰宅後の全行動を証明しない。", "path": "検討/ノート/E08.md"}, {"id": "E09", "title": "木村の紛失と当日行動の調書", "kind": "準備資料", "side": "共通", "status": "採否留保", "review": "未レビュー", "priority": 2, "radius": 23, "state": "pending", "availability": "現時点は根拠に不可・採否留保調書", "sources": ["被告人供述"], "summary": "帰宅後外出せず、転倒時に眼鏡を落としたと思う、自転車は当日使っていない等の説明。\n\n\n法廷供述は未確認。原文に12月27日の記載があり、記憶と推測も区別する。", "path": "検討/ノート/E09.md"}, {"id": "E10", "title": "現場の写真と配置", "kind": "証拠", "side": "共通", "status": "採用済み", "review": "未レビュー", "priority": 2, "radius": 23, "state": "available", "availability": "採用済み資料・記載の範囲で利用", "sources": ["現場配置"], "summary": "A・B地点、出入口、照明、駐車場・コンビニ・自宅の位置関係。夜の写真は1月6日撮影。\n\n\n当日全車両配置・照度・正確な距離は不明。", "path": "検討/ノート/E10.md"}, {"id": "F01", "title": "現場の眼鏡は木村の物と結び付く", "kind": "間接事実", "side": "共通", "status": "資料記載", "review": "未レビュー", "priority": 2, "radius": 23, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["眼鏡"], "summary": "現場で見つかった眼鏡と木村との所有・使用上の結び付きがある。\n\n\n事件当日の着用者や落下経緯までは含まない。", "path": "検討/ノート/F01.md"}, {"id": "F02", "title": "その眼鏡に被害者由来の血液", "kind": "間接事実", "side": "共通", "status": "資料記載", "review": "未レビュー", "priority": 2, "radius": 23, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["眼鏡"], "summary": "眼鏡の血痕DNA型は被害者と一致するとの報告がある。\n\n\n血液の付着方法・時刻を含めて認めるものではない。", "path": "検討/ノート/F02.md"}, {"id": "F03", "title": "清掃時に眼鏡を見なかったとの供述", "kind": "間接事実", "side": "共通", "status": "法廷未確認", "review": "未レビュー", "priority": 2, "radius": 23, "state": "conditional", "availability": "条件付き・未確認の前提あり：E07,F03", "sources": ["清掃供述"], "summary": "【法廷未確認・現時点で認定根拠に不可】大滝は18時頃の清掃で眼鏡を見なかったと調書で説明している。\n\n\n見なかったことと、存在しなかったことは異なる。", "path": "検討/ノート/F03.md"}, {"id": "F04", "title": "木村も使える自転車に被害者血液", "kind": "間接事実", "side": "共通", "status": "資料記載", "review": "未レビュー", "priority": 2, "radius": 23, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["自転車"], "summary": "木村が通常利用する共用自転車に岸井の血液が付いていた。\n\n\n木村の事件時の使用や血液付着の機会は特定されていない。", "path": "検討/ノート/F04.md"}, {"id": "F05", "title": "現場南方で男性が自転車走行", "kind": "間接事実", "side": "共通", "status": "資料記載", "review": "未レビュー", "priority": 2, "radius": 23, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["防犯映像"], "summary": "20時32分頃、現場の南方約200m付近で男性が南へ走行した。\n\n\n映像人物・車両の同一性、現場出発・自宅到着を意味しない。", "path": "検討/ノート/F05.md"}, {"id": "F06", "title": "岸井への怒りと駐車場の認識", "kind": "間接事実", "side": "共通", "status": "資料記載", "review": "未レビュー", "priority": 2, "radius": 23, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["LINE"], "summary": "木村は岸井への怒りと、近所の駐車場でよく見ることを送信している。\n\n\n怒りがあることと、実際に犯行を行ったことは別。", "path": "検討/ノート/F06.md"}, {"id": "F07", "title": "胸腹部を含む刺創と出血死", "kind": "間接事実", "side": "共通", "status": "資料記載", "review": "未レビュー", "priority": 2, "radius": 23, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["検案"], "summary": "甲1の検案結果では複数の刺創があり、それらの傷による出血性ショック死とされる。\n\n\n刺した人物の身元は、この報告だけでは特定できない。", "path": "検討/ノート/F07.md"}, {"id": "Q01", "title": "B地点の観察を具体化する", "kind": "確認課題", "side": "共通", "status": "確認待ち", "review": "未レビュー", "priority": 2, "radius": 23, "state": "question", "availability": "確認作業・回答は未記録", "sources": ["清掃供述"], "summary": "B地点をどの方向から確認したか、車・影、時間、当日の記憶を質問する。\n\n\n想定回答は証言ではない。実際の回答を記録してから更新。", "path": "検討/ノート/Q01.md"}, {"id": "Q02", "title": "眼鏡落下の記憶と推測を分ける", "kind": "確認課題", "side": "共通", "status": "確認待ち", "review": "未レビュー", "priority": 2, "radius": 23, "state": "question", "availability": "確認作業・回答は未記録", "sources": ["被告人供述"], "summary": "転倒、眼鏡着用、落下を見たか、時刻・場所・日付を個別に確認する。\n\n\n原文の日付を勝手に訂正しない。", "path": "検討/ノート/Q02.md"}, {"id": "Q03", "title": "事件時の自転車使用と映像の同一性", "kind": "確認課題", "side": "共通", "status": "確認待ち", "review": "未レビュー", "priority": 2, "radius": 23, "state": "question", "availability": "確認作業・回答は未記録", "sources": ["自転車", "防犯映像"], "summary": "当日使用の具体的根拠、識別特徴・鑑定の記載があるか確認する。\n\n\n資料にない目撃・鑑定結果は追加できない。", "path": "検討/ノート/Q03.md"}, {"id": "Q04", "title": "LINEの意味と殺意の推論を分ける", "kind": "確認課題", "side": "共通", "status": "確認待ち", "review": "未レビュー", "priority": 2, "radius": 23, "state": "question", "availability": "確認作業・回答は未記録", "sources": ["LINE", "検案"], "summary": "感情、所在認識、実行、刺突行為者の殺意を別々に点検する。\n\n\n当事者の印象だけを理由にしない。", "path": "検討/ノート/Q04.md"}, {"id": "Q05", "title": "双方の反論に応答してから原稿化", "kind": "確認課題", "side": "共通", "status": "確認待ち", "review": "未レビュー", "priority": 2, "radius": 23, "state": "question", "availability": "確認作業・回答は未記録", "sources": ["総合評価"], "summary": "支持する理由、相手側の最も強い反論、足りない前提、人間の判断を確認する。\n\n\n採用としたカードも自動的に法的な証明が十分になるわけではない。", "path": "検討/ノート/Q05.md"}, {"id": "R01", "title": "清掃後に眼鏡が来たという推認", "kind": "推認", "side": "検察", "status": "推論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "conditional", "availability": "条件付き・未確認の前提あり：E07,F03", "sources": ["眼鏡", "清掃供述", "現場配置"], "summary": "当日のB地点を十分観察し見落としがないなら、清掃後に眼鏡が来たという説明を考えられる。\n\n\n「B地点を見た」「見落としが少ない」という橋渡しが必要。移動の可能性も別途検討。", "path": "検討/ノート/R01.md"}, {"id": "R02", "title": "木村が事件時に現場にいたという推認", "kind": "推認", "side": "検察", "status": "推論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "conditional", "availability": "条件付き・未確認の前提あり：E07,F03", "sources": ["眼鏡", "清掃供述"], "summary": "所有・被害者血液・清掃後の落下を合わせ、木村の事件時の在場を検討する。\n\n\n着用者と付着機序の特定が必要。在場が認められても直ちに刺突行為者とはならない。", "path": "検討/ノート/R02.md"}, {"id": "R03", "title": "共用自転車を犯行後に使ったという仮説", "kind": "推認", "side": "検察", "status": "推論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["自転車"], "summary": "使用可能な自転車の被害者血液を、犯行後の移動という仮説と照合する。\n\n\n可能な説明の一つ。時刻と使用者の裏付けが不足。", "path": "検討/ノート/R03.md"}, {"id": "R04", "title": "映像が犯行後の移動を補助するという案", "kind": "推認", "side": "検察", "status": "推論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["防犯映像", "自転車"], "summary": "時間・方向の整合を、犯行後の移動の補助事情として検討する。\n\n\n人物・車両の同一性は未確認。R03を前提に映像を特定し、その映像でR03を証明する循環を避ける。", "path": "検討/ノート/R04.md"}, {"id": "R05", "title": "怒りと所在認識を動機の補助にする", "kind": "推認", "side": "検察", "status": "推論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["LINE"], "summary": "岸井に怒りを向け、所在を知っていた事情を動機・機会の補助として考える。\n\n\n実行や計画まで導かない。一般的な性格推論へ広げない。", "path": "検討/ノート/R05.md"}, {"id": "R06", "title": "刺創の部位と複数性から殺意を考える", "kind": "推認", "side": "検察", "status": "推論案", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["検案"], "summary": "胸・腹部を含む複数刺創から、行為者の殺意を検討する。\n\n\n傷の深さ・刺突の状況・順序は不明。行為者の殺意と木村が行為者かは別。", "path": "検討/ノート/R06.md"}, {"id": "T00", "title": "被告人は有罪である", "kind": "最終結論", "side": "検察", "status": "最終的に証明したい命題・未認定", "review": "未レビュー", "priority": 5, "radius": 56, "state": "conditional", "availability": "条件付き・未確認の前提あり：E07,F03", "sources": ["総合評価"], "summary": "ピラミッドの頂点。検察側が最終的に証明したい結論。\n\nその下に、犯人性・因果関係・殺意の三つの枝をつなぐ。頂点を掲げることは、証明済みと判断することではない。", "path": "検討/ノート/T00.md"}, {"id": "T01", "title": "木村が岸井への刺突行為を行ったか", "kind": "要証事実", "side": "検察", "status": "争点", "review": "未レビュー", "priority": 4, "radius": 42, "state": "conditional", "availability": "条件付き・未確認の前提あり：E07,F03", "sources": ["眼鏡", "清掃供述", "自転車", "防犯映像", "LINE"], "summary": "犯人性の検討対象。現在は双方の検討を置いた未決の問い。\n\n\n検察側候補の支持線を描いただけで結論ではない。証拠全体と別の説明を検討し、人間が判断する。", "path": "検討/ノート/T01.md"}, {"id": "T02", "title": "刺突と死亡が結び付くか", "kind": "要証事実", "side": "検察", "status": "争点", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["検案"], "summary": "甲1の検案結果から、刺創と死亡との因果関係を検討する。\n\n\n犯人性は別問題。資料にない治療経過を作らない。", "path": "検討/ノート/T02.md"}, {"id": "T03", "title": "刺突行為者に殺意があったか", "kind": "要証事実", "side": "検察", "status": "争点", "review": "未レビュー", "priority": 3, "radius": 32, "state": "analysis", "availability": "検討対象・証明済みを意味しない", "sources": ["検案"], "summary": "刺突行為者の殺意の検討対象。木村への帰属にはT01の検討も必要。\n\n\nこの図だけでは有罪の要件全体の証明は完了しない。", "path": "検討/ノート/T03.md"}, {"id": "W01", "title": "大滝の法廷証言で清掃と観察条件を確認する", "kind": "供述獲得候補", "side": "共通", "status": "未獲得", "review": "未レビュー", "priority": 2, "radius": 23, "state": "candidate", "availability": "供述の獲得候補・まだ証拠ではない", "sources": ["清掃供述"], "summary": "18時頃に清掃したか、B地点を実際にどのように見たか、眼鏡を見なかったかを尋問で確認する。\n\n検察は観察の具体性、弁護は見落としの可能性を確認する。回答によって、どちらに有利になるかも変わる。甲3の記載をそのまま回答として扱わない。", "path": "検討/ノート/W01.md"}, {"id": "W02", "title": "被告人質問で紛失と当日行動の説明を得る", "kind": "供述獲得候補", "side": "共通", "status": "未獲得", "review": "未レビュー", "priority": 2, "radius": 23, "state": "candidate", "availability": "供述の獲得候補・まだ証拠で
